[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caregap"
version = "0.2.1"
description = "지역 돌봄 공개 집계와 가정에 따른 배분 대안 비교"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.45,<2", "pandas>=2.2,<4", "openpyxl>=3.1,<4", "scikit-learn>=1.5,<2", "ortools>=9.12,<10"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
geo = ["pyshp==3.0.3", "pyproj==3.7.2", "shapely==2.1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
